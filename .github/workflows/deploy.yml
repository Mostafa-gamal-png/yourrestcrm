# Deploys crm.yourrest.org the way the update guides do it by hand, from a package that was built and rehearsed before it was committed,
# the way the Sadeem CRM is updated: cPanel's API with a token, no SSH key.
# Started by a push that changes deploy/request.json, or by hand from the Actions tab (the mode chosen there replaces the file's):
#   {"mode": "check", "package": "deploy/packages/<zip>", "sha256": "<hex>", "stage": "yourrest-crm-<name>-<date>", "helper": "yourrest-activate-<name>.cjs"}
#   check   unpack the package beside the app and run the activator's --check: the app keeps running and nothing changes
#   deploy  check, stop the app, the activator (the day's backup and the switch), start the app, --verify
#   verify  --verify only (after Start App was pressed in cPanel)
#   diagnose  a read-only check of the live data: {"mode": "diagnose", "script": "scripts/diagnose/<name>.cjs"}; no package, the app keeps running
#   backup  {"mode": "backup"}: a verified backup now with the live release's tools, then the daily backup cron line (03:15 Riyadh, added once)
#   prune   {"mode": "prune", "dryRun": true, "remove": ["<old copy in the home folder>", ...]}: scripts/prune/old-copies.cjs checks the
#           whole list (old copies of ours, nothing recent or in use, last night's backup verified) and removes it, or with dryRun only says
#           what it would remove. A run asked for by hand from the Actions tab takes the file's list.
# scripts/deploy-cpanel.mjs uploads through the API and runs scripts/hosting-deploy.sh on the account through a temporary cron line.
# Claude pushes a deploy request only after the owner said so. Settings > Secrets and variables > Actions > Repository secrets:
#   CPANEL_API_TOKEN   cPanel > Security > Manage API Tokens > Create (the only one needed)
#   CPANEL_HOST, CPANEL_USER   optional: premium137.web-hosting.com and youriedx when not set
# The job runs in the `production` environment: Required reviewers there make every run wait for an approval, if that is wanted.
name: Deploy to crm.yourrest.org

on:
  push:
    branches: ['main', 'claude/**']
    paths: ['deploy/request.json']
  workflow_dispatch:
    inputs:
      mode:
        description: "check = unpack and --check only (the app keeps running); deploy = stop, switch, start, verify; verify = --verify only"
        type: choice
        options: [check, deploy, verify, diagnose, backup, prune]
        default: check
        required: true

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    steps:
      # v5 of both run on Node 24 (GitHub retires Node 20 for actions). setup-node v5 would cache the package
      # manager named in package.json (pnpm, not installed here); this job installs nothing, so that is off.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Read and check the request
        id: request
        env:
          IN_MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'EOF'
          import hashlib, json, os, re, sys, zipfile
          def stop(message):
              print(f"::error title=deploy request::{message}"); sys.exit(1)
          r = json.load(open("deploy/request.json"))
          mode = os.environ.get("IN_MODE") or r.get("mode", "")
          if mode == "diagnose":
              script = str(r.get("script", ""))
              if not re.fullmatch(r"scripts/diagnose/[a-z0-9-]+\.cjs", script) or not os.path.isfile(script): stop("script: a read-only check committed under scripts/diagnose/")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out: out.write(f"mode=diagnose\nscript={script}\n")
              print(f"Request: diagnose {script}"); sys.exit(0)
          if mode == "prune":
              remove, dry = r.get("remove"), r.get("dryRun")
              name = re.compile(r"(yourrest-[a-z0-9][A-Za-z0-9._-]{0,127}|Yourrest-CRM-[A-Za-z0-9._-]{1,120}\.zip)")
              if not isinstance(dry, bool): stop("dryRun: true (say what would be removed) or false (remove)")
              if not isinstance(remove, list) or not 1 <= len(remove) <= 200 or len(set(map(str, remove))) != len(remove) or not all(isinstance(n, str) and name.fullmatch(n) and ".." not in n for n in remove): stop("remove: 1 to 200 different names of old copies in the home folder")
              listed = os.path.join(os.environ["RUNNER_TEMP"], "prune.json")
              with open(listed, "w") as f: json.dump({"remove": remove, "dryRun": dry}, f)
              with open(os.environ["GITHUB_OUTPUT"], "a") as out: out.write(f"mode=prune\nlist={listed}\n")
              print(f"Request: prune {len(remove)} old copies{' (dry run)' if dry else ''}"); sys.exit(0)
          if mode == "backup":
              with open(os.environ["GITHUB_OUTPUT"], "a") as out: out.write("mode=backup\n")
              print("Request: backup"); sys.exit(0)
          package, sha, stage, helper = (str(r.get(k, "")) for k in ("package", "sha256", "stage", "helper"))
          if mode not in ("check", "deploy", "verify"): stop("mode: check, deploy, verify, diagnose, backup or prune")
          if not re.fullmatch(r"yourrest-crm-[a-z0-9-]+", stage): stop("stage: yourrest-crm-<name>-<date>, as the update guide names the folder")
          if not re.fullmatch(r"yourrest-activate-[a-z0-9-]+\.cjs", helper): stop("helper: yourrest-activate-<name>.cjs, as the update guide names it")
          if not re.fullmatch(r"deploy/packages/[A-Za-z0-9._-]+\.zip", package) or not os.path.isfile(package): stop("package: a zip committed under deploy/packages/")
          with open(package, "rb") as f: actual = hashlib.sha256(f.read()).hexdigest()
          if actual != sha: stop(f"sha256: the committed package is {actual}, not the one the request names")
          names = set(zipfile.ZipFile(package).namelist())
          if helper not in names or "RELEASE-SHA256SUMS.txt" not in names or not any(n.startswith("release/") for n in names): stop("the package has no release/, RELEASE-SHA256SUMS.txt or the helper at its root")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"mode={mode}\npackage={package}\nsha256={sha}\nstage={stage}\nhelper={helper}\n")
          print(f"Request: {mode} {package} ({sha[:12]}) into {stage}")
          EOF
      - name: Run it on the hosting account through cPanel
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST || 'premium137.web-hosting.com' }}
          CPANEL_USER: ${{ secrets.CPANEL_USER || 'youriedx' }}
          MODE: ${{ steps.request.outputs.mode }}
          PACKAGE: ${{ steps.request.outputs.package }}
          SHA: ${{ steps.request.outputs.sha256 }}
          STAGE: ${{ steps.request.outputs.stage }}
          HELPER: ${{ steps.request.outputs.helper }}
          SCRIPT: ${{ steps.request.outputs.script }}
          LIST: ${{ steps.request.outputs.list }}
        run: |
          if [ -z "$CPANEL_API_TOKEN" ]; then echo "::error title=deploy failed::the repository secret CPANEL_API_TOKEN is not set"; exit 1; fi
          if [ "$MODE" = diagnose ]; then node scripts/deploy-cpanel.mjs --mode diagnose --script "$SCRIPT" --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"; exit; fi
          if [ "$MODE" = backup ]; then node scripts/deploy-cpanel.mjs --mode backup --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"; exit; fi
          if [ "$MODE" = prune ]; then node scripts/deploy-cpanel.mjs --mode prune --list "$LIST" --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"; exit; fi
          node scripts/deploy-cpanel.mjs --mode "$MODE" --package "$PACKAGE" --sha256 "$SHA" --stage "$STAGE" --helper "$HELPER" --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
