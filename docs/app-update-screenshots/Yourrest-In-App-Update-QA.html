7\u0644\u062E\u0627\u0646\u0629 \u0627\u0644\u0641\u0627\u0631\u063A\u0629 \u063A\u064A\u0631 \u0645\u0642\u064A\u0651\u0645\u0629\u061B \u0627\u0644\u0635\u0641\u0631 \u062F\u0631\u062C\u0629 \u0645\u0633\u062C\u0644\u0629.":"A blank field is unassessed; zero is a recorded score.","\u062F\u0642\u0629 \u0648\u0627\u0643\u062A\u0645\u0627\u0644 \u0627\u0644\u0628\u064A\u0627\u0646\u0627\u062A":"Data accuracy and completeness","\u0639\u062F\u062F \u0627\u0644\u0633\u062C\u0644\u0627\u062A \u0627\u0644\u062A\u064A \u062A\u0645\u062A \u0645\u0631\u0627\u062C\u0639\u062A\u0647\u0627":"Records reviewed","\u0639\u062F\u062F \u0627\u0644\u0633\u062C\u0644\u0627\u062A \u0627\u0644\u0635\u062D\u064A\u062D\u0629 \u0648\u0627\u0644\u0645\u0643\u062A\u0645\u0644\u0629":"Correct and complete records","\u0645\u0631\u062C\u0639 \u062A\u062F\u0642\u064A\u0642 \u0627\u0644\u0628\u064A\u0627\u0646\u0627\u062A (\u0627\u062E\u062A\u064A\u0627\u0631\u064A)":"Data review reference (optional)","\u0627\u0644\u062F\u0631\u062C\u0629 \u0645\u0646 100":"Score out of 100","\u0633\u0628\u0628 \u0627\u0644\u062F\u0631\u062C\u0629 / \u0645\u0631\u062C\u0639 \u0627\u0644\u0628\u064A\u0627\u0646\u0627\u062A (\u0627\u062E\u062A\u064A\u0627\u0631\u064A)":"Score rationale / source (optional)","\u062D\u0641\u0638 \u0627\u0644\u062A\u0642\u064A\u064A\u0645":"Save assessment",\u0627\u0644\u062A\u062D\u0635\u064A\u0644:"Collections","\u0646\u0645\u0648 \u0645\u0628\u064A\u0639\u0627\u062A \u0627\u0644\u0623\u0635\u0646\u0627\u0641":"Product sales growth","\u062A\u0639\u062F\u062F \u0627\u0644\u0623\u0635\u0646\u0627\u0641 \u062F\u0627\u062E\u0644 \u0627\u0644\u0641\u0627\u062A\u0648\u0631\u0629":"Product diversity per invoice","\u0627\u0644\u062D\u0641\u0627\u0638 \u0639\u0644\u0649 \u0627\u0644\u0639\u0645\u0644\u0627\u0621 \u0627\u0644\u062D\u0627\u0644\u064A\u064A\u0646":"Customer retention","\u0645\u0639\u062F\u0644 \u062A\u062D\u0648\u064A\u0644 \u0627\u0644\u0641\u0631\u0635 \u0625\u0644\u0649 \u0639\u0631\u0648\u0636":"Qualified opportunity to quotation conversion","\u0645\u0639\u062F\u0644 \u062A\u062D\u0648\u064A\u0644 \u0639\u0631\u0636 \u0627\u0644\u0633\u0639\u0631 \u0625\u0644\u0649 \u0645\u0628\u064A\u0639\u0627\u062A":"Quotation to sales conversion","\u062A\u0648\u062B\u064A\u0642 \u0623\u0633\u0628\u0627\u0628 \u0627\u0644\u062E\u0633\u0627\u0631\u0629 \u0648\u0645\u0639\u0644\u0648\u0645\u0627\u062A \u0627\u0644\u0633\u0648\u0642 \u0648\u0627\u0644\u0645\u0646\u0627\u0641\u0633\u064A\u0646":"Documentation of loss reasons and market and competitor information","\u0627\u0644\u0627\u0644\u062A\u0632\u0627\u0645 \u0648\u0627\u0644\u0645\u0633\u0624\u0648\u0644\u064A\u0629":"Commitment and responsibility","\u0627\u0644\u062A\u0639\u0627\u0648\u0646 \u0648\u0627\u0644\u0639\u0645\u0644 \u0627\u0644\u062C\u0645\u0627\u0639\u064A":"Cooperation and teamwork","\u0627\u0644\u0645\u0635\u062F\u0627\u0642\u064A\u0629 \u0648\u0627\u0644\u0634\u0641\u0627\u0641\u064A\u0629":"Credibility and transparency","\u0627\u0644\u0633\u0644\u0648\u0643 \u0627\u0644\u0645\u0647\u0646\u064A \u0645\u0639 \u0627\u0644\u0639\u0645\u064A\u0644":"Professional conduct with customers","\u0627\u0644\u0645\u0638\u0647\u0631 \u0627\u0644\u0639\u0627\u0645 \u0648\u0628\u0646\u0627\u0621 \u0635\u0648\u0631\u0629 \u0630\u0647\u0646\u064A\u0629 \u062C\u064A\u062F\u0629 \u0639\u0646 \u0627\u0644\u0634\u0631\u0643\u0629":"Appearance and company image","\u0627\u0644\u0645\u0628\u064A\u0639\u0627\u062A \u0648\u0627\u0644\u0646\u0645\u0648":"Sales and growth","\u0646\u0645\u0648 \u0648\u062A\u0646\u0648\u0639 \u0627\u0644\u0623\u0635\u0646\u0627\u0641":"Product growth and diversity","\u0627\u0644\u0639\u0645\u0644\u0627\u0621 \u0648\u0627\u0644\u0633\u0648\u0642":"Customers and market","\u0627\u0644\u0643\u0641\u0627\u0621\u0629 \u0648\u0627\u0644\u0625\u0646\u062A\u0627\u062C\u064A\u0629":"Efficiency and productivity","\u0627\u0644\u0633\u0644\u0648\u0643 \u0648\u0627\u0644\u0627\u0644\u062A\u0632\u0627\u0645 \u0627\u0644\u0645\u0647\u0646\u064A":"Professional conduct and commitment","\u062C\u0648\u062F\u0629 \u0627\u0644\u0628\u064A\u0627\u0646\u0627\u062A \u0648\u0625\u062F\u0627\u0631\u0629 \u0627\u0644\u0623\u0639\u0645\u0627\u0644":"Data quality and business management","\u0631\u0627\u062C\u0639 \u0623\u0639\u062F\u0627\u062F \u0627\u0644\u0633\u062C\u0644\u0627\u062A \u0627\u0644\u0635\u062D\u064A\u062D\u0629 \u0648\u0627\u0644\u0645\u0631\u0627\u062C\u0639\u0629.":"Check correct and reviewed record counts.","\u0645\u062C\u0645\u0648\u0639 \u062A\u062D\u0642\u064A\u0642 \u0643\u0645\u064A\u0629 \u0643\u0644 \u0635\u0646\u0641 \u0645\u0636\u0631\u0648\u0628\u064B\u0627 \u0641\u064A \u0648\u0632\u0646\u0647\u060C \u0628\u0633\u0642\u0641 100% \u0644\u0643\u0644 \u0635\u0646\u0641\u061B \u0645\u0633\u0627\u0647\u0645\u0629 \u0627\u0644\u0645\u0624\u0634\u0631 25 \u0646\u0642\u0637\u0629.":"Sum of each product\u2019s quantity target achievement multiplied by its weight, with achievement capped at 100% per product. This indicator contributes up to 25 points.","\u064A\u0644\u0632\u0645 \u0633\u062C\u0644 \u0628\u0627\u0644\u0645\u0633\u062A\u062D\u0642 \u0648\u0627\u0644\u0645\u062D\u0635\u0644 \u0644\u0643\u0644 \u0645\u0646\u062F\u0648\u0628\u061B \u0642\u064A\u0645\u0629 \u0627\u0644\u0645\u0628\u064A\u0639\u0627\u062A \u0644\u0627 \u062A\u0639\u0646\u064A \u0627\u0644\u062A\u062D\u0635\u064A\u0644.":"A record of amounts due and collected for each sales rep is required. Sales value does not indicate collections.","\u0646\u0645\u0648 \u0643\u0645\u064A\u0627\u062A \u0627\u0644\u0623\u0635\u0646\u0627\u0641 \u0627\u0644\u0645\u0633\u062C\u0644\u0629 \u0645\u0642\u0627\u0631\u0646\u0629 \u0628\u0627\u0644\u0641\u062A\u0631\u0629 \u0627\u0644\u0645\u0646\u0627\u0638\u0631\u0629 \u0645\u0646 \u0627\u0644\u0634\u0647\u0631 \u0627\u0644\u0633\u0627\u0628\u0642\u060C \u0645\u0636\u0631\u0648\u0628\u064B\u0627 \u0641\u064A \u0623\u0648\u0632\u0627\u0646 \u0627\u0644\u0623\u0635\u0646\u0627\u0641. \u062A\u0633\u062A\u0628\u0639\u062F \u0627\u0644\u0641\u0648\u0627\u062A\u064A\u0631 \u0627\u0644\u0645\u0644\u063A\u0627\u0629 \u0648\u064A\u064F\u062D\u0635\u0631 \u0627\u0644\u0625\u062C\u0645\u0627\u0644\u064A \u0628\u064A\u0646 \u0635\u0641\u0631 \u0648100.":"Growth in recorded product quantities compared with the corresponding period of the previous month, multiplied by product weights. Voided invoices are excluded, and the total is limited to a range of 0\u2013100.","\u0627\u0644\u0641\u0648\u0627\u062A\u064A\u0631 \u0627\u0644\u062A\u064A \u062A\u0634\u0645\u0644 3 \u0623\u0635\u0646\u0627\u0641 \u0645\u062E\u062A\u0644\u0641\u0629 \u0623\u0648 \u0623\u0643\u062B\u0631 \xF7 \u0625\u062C\u0645\u0627\u0644\u064A \u0627\u0644\u0641\u0648\u0627\u062A\u064A\u0631 \u0627\u0644\u0645\u0633\u062C\u0644\u0629 \u063A\u064A\u0631 \u0627\u0644\u0645\u0644\u063A\u0627\u0629.":"Invoices containing at least 3 distinct products divided by all recorded invoices that have not been voided.","\u0628\u0639\u0636 \u0627\u0644\u0639\u0645\u0644\u0627\u0621 \u0627\u0644\u0642\u062F\u0627\u0645\u0649 \u0644\u0627 \u064A\u062D\u0645\u0644\u0648\u0646 \u0647\u0648\u064A\u0629 \u0645\u0646\u0634\u0626\u0647\u0645\u061B \u0644\u0627 \u062A\u064F\u0646\u0633\u0628 \u0625\u0636\u0627\u0641\u062A\u0647\u0645 \u0644\u0644\u0645\u0633\u0624\u0648\u0644 \u0627\u0644\u062D\u0627\u0644\u064A \u0628\u0627\u0644\u062A\u062E\u0645\u064A\u0646.":"Some older customer records lack creator details; they are not credited to the current owner without evidence.","\u0627\u0644\u0639\u0645\u0644\u0627\u0621 \u0627\u0644\u0645\u0636\u0627\u0641\u0648\u0646 \u064A\u062F\u0648\u064A\u064B\u0627 \u0628\u0648\u0627\u0633\u0637\u0629 \u0627\u0644\u0645\u0646\u062F\u0648\u0628 \u062E\u0644\u0627\u0644 \u0627\u0644\u0634\u0647\u0631 \xF7 \u0645\u0633\u062A\u0647\u062F\u0641 \u0627\u0644\u0639\u0645\u0644\u0627\u0621 \u0627\u0644\u062C\u062F\u062F. \u064A\u0633\u062A\u0628\u0639\u062F \u0627\u0644\u0627\u0633\u062A\u064A\u0631\u0627\u062F \u0648\u0627\u0644\u062A\u062D\u062F\u064A\u062B \u0648\u0625\u0639\u0627\u062F\u0629 \u0627\u0644\u0625\u0633\u0646\u0627\u062F.":"Customers manually added by the sales rep during the month divided by the new customer target. Imports, updates, and reassignment are excluded.","\u064A\u0644\u0632\u0645 \u0633\u062C\u0644 \u0634\u0631\u0627\u0621 \u062A\u0641\u0635\u064A\u0644\u064A \u0645\u0643\u062A\u0645\u0644: \u0634\u0631\u0627\u0621 \u0642\u062F\u064A\u0645\u060C \u062A\u0648\u0642\u0641 \u062B\u0644\u0627\u062B\u0629 \u0623\u0634\u0647\u0631 \u0643\u0627\u0645\u0644\u0629\u060C \u062B\u0645 \u0639\u0648\u062F\u0629 \u0644\u0644\u0634\u0631\u0627\u0621 \u0641\u064A \u0634\u0647\u0631 \u0627\u0644\u062A\u0642\u064A\u064A\u0645 \xF7 \u0645\u0633\u062A\u0647\u062F\u0641 \u0627\u0644\u0627\u0633\u062A\u0631\u062F\u0627\u062F.":"Complete purchase history is required: customers with an earlier purchase, no purchases for three full months, and a return to purchasing in the assessment month, divided by the reactivation target.","\u064A\u0644\u0632\u0645 \u0633\u062C\u0644 \u0634\u0631\u0627\u0621 \u0645\u0643\u062A\u0645\u0644 \u0644\u0644\u0634\u0647\u0631 \u0648\u0627\u0644\u0623\u0634\u0647\u0631 \u0627\u0644\u062B\u0644\u0627\u062B\u0629 \u0627\u0644\u0633\u0627\u0628\u0642\u0629: \u0627\u0644\u0645\u0634\u062A\u0631\u0648\u0646 \u0641\u064A \u0627\u0644\u0641\u062A\u0631\u062A\u064A\u0646 \xF7 \u0627\u0644\u0645\u0634\u062A\u0631\u064A\u0646 \u0641\u064A \u0627\u0644\u0623\u0634\u0647\u0631 \u0627\u0644\u062B\u0644\u0627\u062B\u0629 \u0627\u0644\u0633\u0627\u0628\u0642\u0629.":"Complete purchase history for the assessment month and the three preceding months is required: customers purchasing in both periods divided by those purchasing in the three preceding months.","\u0627\u0644\u0632\u064A\u0627\u0631\u0627\u062A \u0627\u0644\u0645\u0633\u062C\u0644\u0629 \u0648\u0627\u0644\u0645\u062A\u0627\u0628\u0639\u0627\u062A \u0645\u0646 \u0646\u0648\u0639 \u0632\u064A\u0627\u0631\u0629 \u0641\u0642\u0637 \xF7 \u0645\u0633\u062A\u0647\u062F\u0641 \u0627\u0644\u0632\u064A\u0627\u0631\u0627\u062A.":"Recorded visits and follow-ups explicitly recorded as visits divided by the visit target.","\u0632\u064A\u0627\u0631\u0627\u062A \u0627\u0644\u0634\u0647\u0631 \u0627\u0644\u0645\u0631\u062A\u0628\u0637\u0629 \u0628\u0639\u0645\u0644\u0627\u0621 \u0641\u064A \u0645\u0631\u062D\u0644\u0629 \u0628\u064A\u0639 \u0645\u0641\u062A\u0648\u062D\u0629 \u062D\u0627\u0644\u064A\u064B\u0627 \xF7 \u062C\u0645\u064A\u0639 \u0632\u064A\u0627\u0631\u0627\u062A \u0627\u0644\u0634\u0647\u0631\u060C \u0648\u0641\u0642 \u062A\u0639\u0631\u064A\u0641 gscoinvest.":"Monthly visits linked to customers whose sales stage is currently open divided by all monthly visits, using the gscoinvest definition.","\u0627\u0644\u0639\u0645\u0644\u0627\u0621 \u0627\u0644\u0630\u064A\u0646 \u0628\u062F\u0623 \u062A\u0648\u0627\u0635\u0644\u0647\u0645 \u0641\u064A \u0627\u0644\u0634\u0647\u0631\u060C \u0648\u0645\u0627 \u0632\u0627\u0644\u0648\u0627 \u0641\u064A \u0645\u0631\u062D\u0644\u0629 \u0645\u0641\u062A\u0648\u062D\u0629\u060C \u0648\u062A\u0623\u0647\u0644\u0648\u0627 \u0628\u062C\u0645\u0639 \u0627\u0644\u0645\u0648\u0627\u0635\u0641\u0627\u062A \u0623\u0648 \u0627\u0644\u0645\u0631\u0627\u062C\u0639\u0629 \u0627\u0644\u0641\u0646\u064A\u0629: \u0645\u064E\u0646 \u0633\u064F\u062C\u0651\u0644 \u0644\u0647\u0645 \u0639\u0631\u0636 \u0628\u0639\u062F \u0627\u0644\u062A\u0623\u0647\u064A\u0644 \xF7 \u062C\u0645\u064A\u0639 \u0627\u0644\u0645\u0624\u0647\u0644\u064A\u0646.":"Among customers first contacted during the month who remain in an open stage and qualified through specification gathering or technical review: those with a quotation recorded after qualification divided by all qualified customers.","\u064A\u0644\u0632\u0645 \u0631\u0628\u0637 \u0639\u0631\u0648\u0636 \u0627\u0644\u0623\u0633\u0639\u0627\u0631 \u0628\u0627\u0644\u0641\u0648\u0627\u062A\u064A\u0631 \u0627\u0644\u0641\u0639\u0644\u064A\u0629\u061B \u062A\u0623\u0643\u064A\u062F \u0627\u0644\u062A\u062D\u0648\u064A\u0644 \u0641\u064A \u0627\u0644\u0645\u062A\u0627\u0628\u0639\u0629 \u0648\u062D\u062F\u0647 \u0644\u0627 \u064A\u0643\u0641\u064A.":"Quotations must be linked to actual invoices; confirming conversion in a follow-up alone is insufficient.","\u0627\u0644\u0633\u062C\u0644\u0627\u062A \u0627\u0644\u0635\u062D\u064A\u062D\u0629 \u0648\u0627\u0644\u0645\u0643\u062A\u0645\u0644\u0629 \xF7 \u0627\u0644\u0633\u062C\u0644\u0627\u062A \u0627\u0644\u062A\u064A \u0631\u0627\u062C\u0639\u062A\u0647\u0627 \u0627\u0644\u0625\u062F\u0627\u0631\u0629.":"Correct and complete records divided by records reviewed by management.","\u0627\u0644\u0639\u0645\u0644\u0627\u0621 \u0627\u0644\u0630\u064A\u0646 \u0628\u062F\u0623 \u062A\u0648\u0627\u0635\u0644\u0647\u0645 \u0641\u064A \u0627\u0644\u0634\u0647\u0631 \u0648\u0648\u0635\u0644\u0648\u0627 \u0644\u0644\u0641\u0642\u062F \u0645\u0639 \u0633\u0628\u0628 \u0645\u0648\u062B\u0642 \xF7 \u062C\u0645\u064A\u0639 \u062D\u0627\u0644\u0627\u062A \u0627\u0644\u0641\u0642\u062F \u0644\u0646\u0641\u0633 \u0627\u0644\u0645\u062C\u0645\u0648\u0639\u0629.":"Customers first contacted during the month who were lost with a documented reason divided by all lost customers in the same group.","\u062F\u0631\u062C\u0629 \u0627\u0644\u0625\u062F\u0627\u0631\u0629 \u0645\u0646 \u0635\u0641\u0631 \u0625\u0644\u0649 100 \u0645\u0639 \u0645\u0644\u0627\u062D\u0638\u0629 \u0627\u062E\u062A\u064A\u0627\u0631\u064A\u0629.":"Management score from 0 to 100 with an optional note.","\u062A\u0642\u064A\u064A\u0645 \u0627\u0644\u0625\u062F\u0627\u0631\u0629 \u0645\u062A\u0627\u062D \u0644\u0645\u062F\u064A\u0631 \u0627\u0644\u0646\u0638\u0627\u0645 \u0648\u0645\u062F\u064A\u0631 \u0627\u0644\u0645\u0628\u064A\u0639\u0627\u062A \u0641\u0642\u0637":"Only system administrators and sales managers can record management assessments","\u0644\u0627 \u064A\u0645\u0643\u0646 \u062A\u0642\u064A\u064A\u0645 \u0634\u0647\u0631 \u0642\u0627\u062F\u0645":"A future month cannot be assessed","\u062D\u062F\u062F \u0639\u0636\u0648\u064B\u0627 \u0645\u0641\u0639\u0651\u0644\u064B\u0627 \u0644\u0644\u062A\u0642\u064A\u064A\u0645":"Select an active team member to assess","\u0637\u0644\u0628 \u0627\u0644\u062A\u0642\u064A\u064A\u0645 \u0645\u062D\u0641\u0648\u0638 \u0628\u0628\u064A\u0627\u0646\u0627\u062A \u0645\u062E\u062A\u0644\u0641\u0629. \u0623\u0639\u062F \u0641\u062A\u062D \u0627\u0644\u062A\u0642\u064A\u064A\u0645.":"This assessment request has already been saved with different details. Reopen the assessment.","\u062A\u063A\u064A\u0651\u0631 \u0627\u0644\u062A\u0642\u064A\u064A\u0645. \u062D\u062F\u0651\u062B \u0627\u0644\u0628\u064A\u0627\u0646\u0627\u062A \u0648\u0623\u0639\u062F \u0641\u062A\u062D\u0647 \u0642\u0628\u0644 \u0627\u0644\u062D\u0641\u0638.":"The assessment has changed. Refresh the data and reopen it before saving.","\u062A\u0633\u062C\u064A\u0644 \u062A\u0642\u064A\u064A\u0645 \u0627\u0644\u0623\u062F\u0627\u0621":"Record performance assessment","\u0645\u0633\u062A\u0647\u062F\u0641 \u0627\u0644\u0645\u0628\u064A\u0639\u0627\u062A \u0644\u0644\u0645\u062F\u064A\u0631 \u0648\u0627\u0644\u0645\u0634\u0631\u0641 \u0625\u062C\u0645\u0627\u0644\u064A \u0627\u0644\u0645\u0646\u0627\u062F\u064A\u0628 \u0627\u0644\u062A\u0627\u0628\u0639\u064A\u0646 \u0644\u0647\u0645\u0627\u060C \u0648\u0644\u0627 \u064A\u064F\u0636\u0627\u0641 \u0645\u0631\u0629 \u062B\u0627\u0646\u064A\u0629 \u0644\u0641\u0631\u0642 \u0627\u0644\u062A\u0648\u0632\u064A\u0639.":"Managers\u2019 and supervisors\u2019 sales targets total the targets of their reporting sales reps and are not counted again in the allocation difference.","\u0644\u0645 \u064A\u064F\u0631\u0628\u0637 \u0641\u0631\u064A\u0642\u061B \u062D\u062F\u0651\u062F \u0627\u0644\u0645\u062F\u064A\u0631 \u0623\u0648 \u0627\u0644\u
